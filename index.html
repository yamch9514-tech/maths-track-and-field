<body>
<style>
/* Layout: single-column phone app. A field-green scoreboard band on top; the units sit around a running track on the stadium map. */
:root{
  --bg:#EDF2EE; --surface:#FFFFFF; --ink:#12241B; --muted:#56685E; --line:#D3DDD6;
  --field:#123D2D; --field-2:#1A4F3B; --field-ink:#F1F6F2; --field-muted:#A9C4B6;
  --track:#B83C25; --track-2:#9E321E; --track-ink:#FFFFFF; --accent:#B83C25; --medal-ink:#2A1F06;
  --gold:#C99A1E; --silver:#8F9AA1; --bronze:#A8693A; --empty:#D3DDD6;
  --good:#1C7F47; --good-bg:#DDF1E4; --bad:#B3261E; --bad-bg:#F8E0DD;
  --bar:#1E6091; --pit:#E6CC97; --water:#2F8FCC; --grass:#2E7D4F;
  --f-display:'Barlow Condensed','Arial Narrow','Roboto Condensed',sans-serif;
  --f-body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#09140F; --surface:#11211A; --ink:#E5EEE8; --muted:#97AEA2; --line:#24392F;
  --field:#0D2C20; --field-2:#15402F; --field-ink:#EAF3ED; --field-muted:#8FB0A0;
  --track:#C4422A; --track-2:#A93520; --accent:#F0876C; --empty:#2C443A;
  --good:#52C485; --good-bg:#12321F; --bad:#F07467; --bad-bg:#3A1A16;
  --bar:#6CB4E4; --pit:#6E5A36; --water:#3C9AD6; --grass:#1F5C3A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#09140F; --surface:#11211A; --ink:#E5EEE8; --muted:#97AEA2; --line:#24392F;
  --field:#0D2C20; --field-2:#15402F; --field-ink:#EAF3ED; --field-muted:#8FB0A0;
  --track:#C4422A; --track-2:#A93520; --accent:#F0876C; --empty:#2C443A;
  --good:#52C485; --good-bg:#12321F; --bad:#F07467; --bad-bg:#3A1A16;
  --bar:#6CB4E4; --pit:#6E5A36; --water:#3C9AD6; --grass:#1F5C3A; color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--track);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;line-height:1.05;text-wrap:balance;margin:0}
h3{font-size:1.4rem}
.num{font-family:var(--f-display);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.86rem}
p.small,p.muted{margin:0}
.center{text-align:center}
.lab{font-size:.78rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 20px;border-radius:999px;border:2px solid var(--line);background:var(--surface);font-weight:700;font-size:1rem;text-align:center;line-height:1.2}
.btn.primary{background:var(--track);border-color:var(--track);color:var(--track-ink)}
.btn.primary:active{background:var(--track-2)}
.btn.block{width:100%}
.btn.sm{min-height:42px;padding:0 14px;font-size:.92rem}
.btn:disabled{opacity:.45;cursor:default}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;padding:10px;font-size:.95rem}
.iconbtn{flex:none;width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0}
.iconbtn.on-field{background:var(--field-2);border-color:var(--field-2);color:var(--field-ink)}
.b-mute[aria-pressed="true"] .wave,.b-mute[aria-pressed="false"] .cross{display:none}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:999px;padding:2px;gap:2px;background:var(--surface)}
.seg button{border:0;background:none;border-radius:999px;padding:6px 14px;font-weight:700;font-size:.88rem;color:var(--muted);min-height:38px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.seg.wide{display:flex;width:100%}.seg.wide button{flex:1;padding:6px 8px}

/* welcome */
.welcome{display:flex;flex-direction:column;gap:18px;padding-block:28px 40px}
.brand{font-size:clamp(2.8rem,13vw,4.2rem);font-weight:800;text-transform:uppercase;line-height:.9}
.brand em{font-style:normal;color:var(--accent)}
.lede{margin:0;color:var(--muted);max-width:38ch}
.lanes{height:44px;border-radius:10px;background:var(--track);background-image:repeating-linear-gradient(180deg,transparent 0 9px,rgba(255,255,255,.85) 9px 11px);position:relative;overflow:hidden}
.lanes::after{content:"";position:absolute;right:18%;top:0;bottom:0;width:6px;background:repeating-linear-gradient(180deg,#fff 0 6px,#111 6px 12px)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.form{display:flex;flex-direction:column;gap:10px}
.form label{font-weight:700}
input[type=text],input:not([type]),textarea,select{width:100%;font:inherit;font-size:1.05rem;padding:12px 14px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
textarea{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.8rem;min-height:96px;resize:vertical;word-break:break-all}
.cls-pick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:6px}
.cls{border:2px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:2px}
.cls b{font-family:var(--f-display);font-size:1.6rem;line-height:1}
.cls small{color:var(--muted);font-size:.78rem}
.cls[aria-pressed=true]{border-color:var(--track);background:var(--surface);box-shadow:inset 0 0 0 1px var(--track)}

/* scoreboard */
.board{background:var(--field);color:var(--field-ink);padding-block:16px 14px}
.board .wrap{display:flex;flex-direction:column;gap:12px}
.b-top{display:flex;align-items:center;gap:12px}
.kit{flex:none;display:block}
.b-name{min-width:0;flex:1}
.b-name h1{font-size:1.75rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.b-name div{color:var(--field-muted);font-size:.88rem}
.xpbar{height:12px;border-radius:999px;background:var(--field-2);overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--track);border-radius:999px;transition:width .6s ease}
.xpline{display:flex;justify-content:space-between;font-size:.8rem;color:var(--field-muted)}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.stat{background:var(--field-2);border-radius:10px;padding:6px 2px;text-align:center}
.stat b{display:block;font-family:var(--f-display);font-size:1.45rem;line-height:1.05;font-variant-numeric:tabular-nums}
.stat small{font-size:.6rem;letter-spacing:.03em;white-space:nowrap;text-transform:uppercase;color:var(--field-muted)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:3px;vertical-align:1px}
.dot.g{background:var(--gold)}.dot.s{background:var(--silver)}.dot.b{background:var(--bronze)}

/* home body */
.home-body{display:flex;flex-direction:column;gap:16px;padding-block:16px 110px}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sec-h h2{font-size:1.5rem;text-transform:uppercase}
.install{display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--field);color:var(--field-ink);border-radius:var(--r);padding:12px 14px}
.install p{margin:0;font-size:.92rem}
.install .btn{flex:none}

/* stadium map */
.map{position:relative;width:100%;max-width:420px;margin:0 auto;aspect-ratio:340/500}
.map-bg{position:absolute;inset:0;width:100%;height:100%;display:block}
.m-track{fill:var(--track)}
.m-lane{fill:none;stroke:rgba(255,255,255,.5);stroke-width:1.4}
.m-field{fill:var(--grass)}
.m-start{stroke:#fff;stroke-width:3;stroke-dasharray:4 4}
.st{position:absolute;transform:translate(-50%,-50%);width:50px;height:50px;border-radius:50%;border:3px solid var(--empty);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0;box-shadow:0 2px 6px rgba(0,0,0,.28);z-index:1}
.st b{font-family:var(--f-display);font-size:1.4rem;font-weight:800;line-height:.9}
.st.g{border-color:var(--gold)}.st.s{border-color:var(--silver)}.st.b{border-color:var(--bronze)}
.st:active{transform:translate(-50%,-50%) scale(.95)}
.mini{display:flex;gap:2px}
.mini .pip{width:7px;height:7px}
.mini .pip.lock{border-width:1px}
.infield{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:50%;display:flex;flex-direction:column;align-items:center;gap:6px;color:#fff;text-align:center}
.infield .lab{color:#fff;font-size:.7rem}
.infield .big{font-size:2.6rem;font-weight:800;line-height:.95}
.infield .big small{font-size:1.1rem;font-weight:700}
.infield .small{color:#fff;margin-top:-4px}
.infield .btn{width:100%;padding:0 8px;font-size:.88rem}
.btn.light{background:#fff;border-color:#fff;color:#12241B}

/* list view */
.relay{display:flex;align-items:center;gap:14px;background:var(--surface);border:2px solid var(--track);border-radius:var(--r);padding:14px 16px;text-align:left;width:100%}
.relay .baton{flex:none;width:46px;height:46px;border-radius:50%;background:var(--track);display:grid;place-items:center}
.relay .baton i{width:28px;height:8px;border-radius:4px;background:var(--track-ink);transform:rotate(-35deg)}
.relay .baton.cup{background:var(--gold)}
.relay .baton.cup i{width:18px;height:22px;border-radius:3px 3px 9px 9px;transform:none;background:var(--medal-ink)}
.relay.champ{border-color:var(--gold)}
.relay h2{font-size:1.4rem}
.relay p{margin:2px 0 0;color:var(--muted);font-size:.9rem}
.relay.done{border-color:var(--line)}
.relay.done .baton{background:var(--good)}
.events{display:flex;flex-direction:column;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.ev{display:flex;align-items:stretch;gap:0;border:0;background:var(--surface);text-align:left;padding:0;min-height:66px;width:100%}
.ev+.ev{border-top:1px solid var(--line)}
.ev-no{flex:none;width:58px;background:var(--track);color:var(--track-ink);font-family:var(--f-display);font-weight:800;font-size:1.9rem;display:flex;align-items:center;justify-content:center;border-right:3px solid var(--track-ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.ev-main{flex:1;min-width:0;padding:10px 12px;display:flex;flex-direction:column;justify-content:center}
.ev-t{font-weight:700;line-height:1.2}
.ev-sub{font-size:.82rem;color:var(--muted)}
.ev-pips{flex:none;display:flex;align-items:center;gap:5px;padding-right:14px}
.ev:active{background:var(--bg)}
.pip{width:16px;height:16px;border-radius:50%;background:var(--empty);display:block;flex:none}
.pip.g{background:var(--gold)}.pip.s{background:var(--silver)}.pip.b{background:var(--bronze)}
.pip.lock{background:transparent;border:2px dashed var(--empty)}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:5}
.nav .wrap{display:grid;grid-template-columns:repeat(4,1fr)}
.nav button{border:0;background:none;padding:10px 0 12px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.76rem;font-weight:700;color:var(--muted);position:relative}
.nav button svg{width:24px;height:24px}
.nav button[aria-current=page]{color:var(--accent)}
.nav .badge{position:absolute;top:6px;left:calc(50% + 8px);background:var(--track);color:var(--track-ink);font-size:.68rem;border-radius:999px;padding:0 6px;line-height:16px}

/* notebook */
.nb-sum{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px}
.nb-sum b{display:block;font-size:2rem;line-height:1}
.nb-sum span{font-size:.86rem;color:var(--muted)}
.nb-item{display:flex;flex-direction:column;gap:8px}
.nb-q{font-size:1.02rem}
.nb-a{background:var(--good-bg);border-radius:10px;padding:8px 12px}
.nb-tip{font-size:.9rem;color:var(--muted)}
.nb-meta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.8rem;color:var(--muted)}
.nb-due{display:flex;align-items:center;gap:10px;font-size:.84rem;color:var(--muted)}
.boxes{display:flex;gap:4px}
.boxes i{width:14px;height:8px;border-radius:2px;background:var(--empty)}
.boxes i.on{background:var(--good)}
.empty{text-align:center;padding:28px 12px;color:var(--muted)}

/* me */
.me-card{display:flex;align-items:center;gap:14px}
.me-card h2{font-size:1.8rem}
.me-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.me-grid .card{padding:12px 14px}
.me-grid b{display:block;font-family:var(--f-display);font-size:1.8rem;line-height:1.1}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row .btn{flex:1}
details.card summary{font-weight:700;cursor:pointer}
.more{margin-top:10px}
ol.steps{margin:8px 0 0;padding-left:20px}
.danger{color:var(--bad);border-color:var(--bad)}
.fitness{display:flex;flex-direction:column;gap:10px}
.train{display:flex;flex-direction:column;gap:8px;background:var(--bg);border-radius:12px;padding:12px}
.train .btn{justify-content:flex-start;text-align:left;padding:8px 14px;height:auto}
details.fit{border-top:1px solid var(--line);padding-top:8px}
details.fit summary{display:flex;justify-content:space-between;gap:8px;align-items:baseline;font-weight:700;cursor:pointer;list-style:none;padding:4px 0}
details.fit summary::-webkit-details-marker{display:none}
details.fit summary::before{content:"▸";margin-right:6px;color:var(--muted)}
details.fit[open] summary::before{content:"▾"}
details.fit summary>span:first-child{flex:1}
.fit-row{display:grid;grid-template-columns:1fr 64px;grid-template-areas:"name val" "bar bar" "flag flag";gap:3px 10px;width:100%;border:0;background:none;text-align:left;padding:8px 0;border-bottom:1px dashed var(--line)}
.fit-name{grid-area:name;font-size:.9rem}
.fit-val{grid-area:val;text-align:right;font-size:1rem;font-weight:700}
.fit-bar{grid-area:bar;height:8px;border-radius:4px;background:var(--empty);overflow:hidden;display:block}
.fit-bar i{display:block;height:100%;background:var(--bar);border-radius:4px}
.flag{grid-area:flag;justify-self:start;font-style:normal;font-size:.74rem;font-weight:700;border:1.5px solid var(--ink);border-radius:999px;padding:0 8px;line-height:1.5}
.flag::before{content:"↑ "}
.kits{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.kitb{border:2px solid var(--line);background:var(--bg);border-radius:12px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px}
.kitb small{font-size:.72rem;color:var(--muted)}
.kitb[aria-pressed=true]{border-color:var(--track);box-shadow:inset 0 0 0 1px var(--track)}
.kitb:disabled{opacity:.5;cursor:default}
.badges{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.badge{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:8px;opacity:.55}
.badge i{flex:none;width:22px;height:22px;border-radius:50%;background:var(--empty);margin-top:2px}
.badge.got{opacity:1;background:var(--bg)}
.badge.got i{background:var(--gold);box-shadow:inset 0 0 0 3px rgba(255,255,255,.4)}
.badge b{display:block;font-size:.88rem;line-height:1.2}
.badge small{display:block;font-size:.74rem;color:var(--muted);line-height:1.25}
.tog{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:4px 0;cursor:pointer}
.tog b{display:block;font-weight:700}
.tog small{display:block;font-size:.8rem;color:var(--muted);font-weight:400}
.tog input{position:absolute;opacity:0;width:1px;height:1px}
.tog i{flex:none;width:50px;height:30px;border-radius:999px;background:var(--empty);position:relative;transition:background .2s}
.tog i::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .2s}
.tog input:checked+i{background:var(--good)}
.tog input:checked+i::after{left:23px}
.tog input:focus-visible+i{outline:3px solid var(--track);outline-offset:2px}

/* leaderboard */
.lb ol{list-style:none;margin:0;padding:0}
.lb li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.lb li:last-child{border-bottom:0}
.lb li.mine{background:var(--bg);margin:0 -10px;padding-inline:10px;border-radius:8px}
.lb-n{flex:none;width:32px;height:32px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-weight:700;font-size:1.2rem}
.lb li:nth-child(1) .lb-n{background:var(--gold);color:var(--medal-ink)}
.lb li:nth-child(2) .lb-n{background:var(--silver);color:var(--medal-ink)}
.lb li:nth-child(3) .lb-n{background:var(--bronze);color:#fff}
.lb-name{flex:1;min-width:0;font-weight:700}
.lb-name em{font-style:normal;font-weight:400;color:var(--muted)}
.lb-name small{display:block;font-weight:400;font-size:.78rem;color:var(--muted)}
.lb-v{flex:none;font-size:1.15rem;font-weight:700}

/* race */
.race-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:3;background:var(--bg);padding-block:10px 8px}
.rt{display:flex;align-items:center;gap:8px}
.quit{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.rt-title{flex:1;min-width:0}
.rt-title b{display:block;font-family:var(--f-display);font-size:1.2rem;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.vis{margin-top:10px}

.track::before{content:"";position:absolute;left:0;right:0;top:5px;bottom:5px;border-top:2px solid rgba(255,255,255,.55);border-bottom:2px solid rgba(255,255,255,.55)}
.track::after{content:"";position:absolute;right:0;top:0;bottom:0;width:8px;background:repeating-linear-gradient(180deg,#fff 0 5px,#111 5px 10px)}
.track .hd{position:absolute;top:7px;bottom:7px;width:5px;margin-left:-2.5px;background:#fff;border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.3)}
.track .hd.water{background:var(--water);width:10px;margin-left:-5px;border-radius:3px}
.track .hd.down{transform:rotate(65deg);opacity:.55}
.track .leg{position:absolute;top:0;bottom:0;border-left:2px dashed rgba(255,255,255,.85)}
.track .ghost{position:absolute;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;border:2.5px dashed #fff;background:rgba(255,255,255,.18);left:4%;z-index:1}
.runner{position:absolute;top:50%;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;border:4px solid #fff;left:4%;transition:left .45s cubic-bezier(.3,1.4,.5,1);z-index:2;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.marks{display:grid;gap:3px;margin-top:6px}
.marks i{height:5px;border-radius:3px;background:var(--empty)}
.marks i.ok{background:var(--good)}.marks i.no{background:var(--bad)}.marks i.now{background:var(--ink)}
.sv{display:block;width:100%;height:auto;max-height:92px}
.sv .gnd{stroke:var(--muted);stroke-width:2}
.sv .up{stroke:var(--ink);stroke-width:4;stroke-linecap:round}
.sv .bar{stroke-width:6;stroke-linecap:round}
.sv .pbl{stroke:var(--muted);stroke-width:1.5;stroke-dasharray:5 4}
.sv .t{fill:var(--ink);font:700 14px var(--f-display)}
.sv .t.s{font-size:12px;fill:var(--muted)}
.sv .t.dim{opacity:.45}
.sv .pit{fill:var(--pit)}
.sv .field{fill:var(--grass);opacity:.35}
.sv .board{stroke:var(--ink);stroke-width:4}
.sv .on{fill:var(--good)}.sv .off{fill:var(--empty)}.sv .miss{fill:var(--bad)}
.sv .mk{stroke:var(--surface);stroke-width:2}
.sv .arc{stroke:var(--surface);stroke-width:2}
.sv .ring{fill:none;stroke:var(--ink);stroke-width:2.5}
.sv .pbc{fill:none;stroke:var(--ink);stroke-width:2;stroke-dasharray:3 3}
.sv .pow{fill:var(--empty)}.sv .pow.on{fill:var(--accent)}.sv .pow.miss{fill:none;stroke:var(--bad);stroke-width:1.5}
.qwrap{display:flex;flex-direction:column;gap:14px;padding-block:8px 270px}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:24px}
.qnum{font-family:var(--f-display);font-size:1rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:700}
.qsec{font-size:.82rem;color:var(--muted);margin-top:-10px}
.qtext{font-size:1.3rem;line-height:1.5;margin:0}
.qtext i,.opt i,.nb-q i,.nb-a i,.pad-disp i{font-family:'Times New Roman',Georgia,serif;font-size:1.1em}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts.one{grid-template-columns:1fr}
.opt{min-height:62px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-size:1.2rem;padding:10px 12px;text-align:center;line-height:1.35;transition:transform .08s}
.opts.one .opt{text-align:left;font-size:1.05rem}
.opt:active{transform:scale(.98)}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.gone{visibility:hidden}
.opt:disabled{cursor:default}

.intro-card{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.intro-card h2{font-size:2rem}
.intro-card p{margin:0}
.count{font-family:var(--f-display);font-weight:800;font-size:2.6rem;text-transform:uppercase;text-align:center;padding:40px 0;color:var(--accent);animation:pop .4s ease both}
.coach{display:flex;gap:10px;align-items:flex-start;background:var(--field);color:var(--field-ink);border-radius:14px;padding:12px 14px}
.coach p{margin:0;font-size:.95rem}
.coach-ic{flex:none;width:32px;height:32px;border-radius:50%;background:var(--gold);color:var(--medal-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1.2rem}
.pad{display:flex;flex-direction:column;gap:8px}
.pad-disp{display:flex;align-items:baseline;justify-content:center;gap:6px;min-height:60px;border:2px solid var(--ink);border-radius:12px;background:var(--surface);font-size:1.6rem;padding:8px 12px}
.pad-disp b{font-family:var(--f-display);font-size:2rem;letter-spacing:.02em}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pk{min-height:52px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-size:1.4rem;font-weight:700}
.pk:active{background:var(--bg)}
.pk.wide2{font-size:1.05rem}
.pk[data-key="del"]{grid-column:1/2}
.pk[data-key="ok"]{grid-column:2/4}
.pk.primary{background:var(--track);border-color:var(--track);color:var(--track-ink)}
.pw{display:flex;flex-wrap:wrap;align-items:center;gap:6px;border-top:1px dashed var(--line);padding-top:10px}
.pw .lab{width:100%}
.pwb{border:2px solid var(--gold);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:700;font-size:.88rem;min-height:40px}
.pwb:disabled{opacity:.4;cursor:default;border-color:var(--line)}
.pw-on{font-weight:700;font-size:.9rem;background:var(--bg);border-radius:999px;padding:6px 12px;border:2px dashed var(--gold)}
.fb{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:4px solid var(--good);box-shadow:0 -10px 30px rgba(0,0,0,.12);padding-block:14px calc(14px + env(safe-area-inset-bottom,0px));max-height:70vh;overflow:auto}
.fb .wrap{display:flex;flex-direction:column;gap:8px}
.fb.no{border-top-color:var(--bad)}
.fb h3{font-size:1.6rem;color:var(--good)}
.fb.no h3{color:var(--bad)}
.fb p{margin:0}
.fb .tip{color:var(--muted);font-size:.92rem}
.fb .rev{font-size:.86rem;font-weight:700}

.fb .mech{font-weight:700}
.fb-btns{display:flex;gap:8px}
.fb-btns .btn{flex:1}
.xpfly{font-family:var(--f-display);font-weight:700;color:var(--accent);font-size:1.1rem}
.calc-open .qwrap{padding-bottom:440px}
.calc{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -10px 30px rgba(0,0,0,.18);padding-block:10px calc(12px + env(safe-area-inset-bottom,0px))}
.calc-top{display:flex;justify-content:space-between;align-items:center}
.calc-disp{background:var(--field);color:var(--field-ink);border-radius:10px;padding:6px 12px;text-align:right;margin-bottom:6px;min-height:54px}
.calc-disp div{font-size:1.1rem;word-break:break-all;color:var(--field-muted)}
.calc-disp b{font-family:var(--f-display);font-size:1.6rem}
.calc-keys{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.calc-keys button{min-height:42px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:1.15rem;font-weight:700}
.calc-keys .op{background:var(--surface)}
.calc-keys .fn{color:var(--bad)}
.calc-keys .eq{grid-column:span 2;background:var(--track);color:var(--track-ink);border-color:var(--track)}

/* maths typesetting */
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.82em;line-height:1.15;margin:0 .12em}
.fr>span:first-child{border-bottom:1.5px solid currentColor;padding:0 .2em}
.vec{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.85em;line-height:1.15;border-left:2px solid currentColor;border-right:2px solid currentColor;border-radius:9px;padding:0 .4em;margin:0 .1em}
sup{font-size:.68em;line-height:0}
.tb{border-collapse:collapse;margin:10px 0;font-size:1rem}
.tb th,.tb td{border:1px solid var(--line);padding:5px 10px;text-align:center}
.tb th{background:var(--bg);font-weight:700}
.tb.sl td{text-align:left;letter-spacing:.35em;min-width:140px}
.key{font-size:.85rem;color:var(--muted);margin-bottom:6px}

/* results */
.res{display:flex;flex-direction:column;align-items:center;gap:14px;padding-block:44px 40px;text-align:center}
.podium-lab{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:700}
.medal{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;position:relative;color:var(--medal-ink);font-family:var(--f-display);font-weight:800;font-size:3.2rem;box-shadow:inset 0 -10px 0 rgba(0,0,0,.18),inset 0 0 0 8px rgba(255,255,255,.28);animation:pop .6s cubic-bezier(.3,1.6,.5,1) both}
.medal.g{background:var(--gold)}.medal.s{background:var(--silver)}.medal.b{background:var(--bronze)}.medal.n{background:var(--empty);color:var(--muted);box-shadow:none}
.medal::before{content:"";position:absolute;top:-34px;left:50%;width:46px;height:44px;margin-left:-23px;background:linear-gradient(90deg,var(--track) 0 33%,var(--field-ink) 33% 66%,var(--track) 66%);clip-path:polygon(0 0,100% 0,72% 100%,28% 100%);z-index:-1}
.medal.n::before{display:none}
@keyframes pop{from{transform:scale(.4) rotate(-12deg);opacity:0}to{transform:none;opacity:1}}
.res h1{font-size:2.6rem;text-transform:uppercase}
.res-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.res-stats .card{padding:10px 6px}
.res-stats b{display:block;font-family:var(--f-display);font-size:1.6rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.res-stats b small{font-size:.7em}
.pb{display:inline-block;background:var(--track);color:var(--track-ink);font-family:var(--f-display);font-weight:700;letter-spacing:.1em;padding:3px 12px;border-radius:6px}
.notes{text-align:left;width:100%}
.notes p{margin:4px 0}
.newb{border-color:var(--gold)}
.res .btns{display:flex;flex-direction:column;gap:10px;width:100%}

/* sheet & toast */
.scrim{position:fixed;inset:0;background:rgba(5,15,10,.5);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;max-height:88%;overflow:auto;animation:up .25s ease both}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet h2{font-size:1.8rem}
.sheet .rules{background:var(--bg);border-radius:10px;padding:10px 12px;color:var(--ink)}
.round{display:flex;align-items:center;gap:12px;border:2px solid var(--line);border-radius:12px;padding:12px;background:var(--bg);text-align:left;width:100%}
.round .pip{width:26px;height:26px}
.round div{flex:1;min-width:0}
.round b{font-family:var(--f-display);font-size:1.3rem;display:block;line-height:1.1}
.round small{color:var(--muted);font-size:.84rem}
.round .go{font-weight:700;color:var(--accent)}
.round:disabled{opacity:.6;cursor:default}
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--field);color:var(--field-ink);padding:10px 18px;border-radius:16px;font-weight:700;z-index:20;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:calc(100% - 32px);text-align:center}
.warn{background:var(--bad-bg);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:.9rem;margin:0}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (max-width:360px){.stats{gap:4px}.stat b{font-size:1.25rem}.stat small{font-size:.52rem}.opt{font-size:1.05rem}.st{width:44px;height:44px}.st b{font-size:1.2rem}.infield .big{font-size:2.1rem}.rt{gap:6px}.clock{min-width:70px;font-size:1.25rem}}

/* Diagrams */
.dg{display:block;width:100%;max-width:360px;height:auto;margin:10px auto 4px;overflow:visible;color:var(--ink)}
.dg line,.dg path,.dg polyline,.dg polygon,.dg circle,.dg rect{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.dg .hl{stroke:var(--accent)}
.dg .thick{stroke-width:3.5}

.dg .pt{fill:var(--accent);stroke:none}

.dg .pto{fill:var(--surface);stroke:var(--accent);stroke-width:2.5}
.dg .fill{fill:var(--accent);fill-opacity:.22}
.dg .bar1{fill:var(--accent);stroke:none}
.dg .bar2{fill:currentColor;fill-opacity:.4;stroke:none}
.dg text{fill:currentColor;stroke:none;font:600 14px var(--f-body)}

.dg .small{font-size:12px}
.dg .note{font-size:10px;font-weight:400;fill:var(--muted)}
.dg .xl{font-family:'Times New Roman',Georgia,serif;font-style:italic;font-size:18px;fill:var(--accent)}
.rd{position:relative;display:inline-block}
.rd::after{content:"";position:absolute;left:50%;top:-.12em;width:.2em;height:.2em;margin-left:-.1em;border-radius:50%;background:currentColor}

/* Classes, events and question selection */
const EVENTS=[
 {name:'100 m Sprint',sport:'sprint'},{name:'Long Jump',sport:'longjump'},{name:'110 m Hurdles',sport:'hurdles'},{name:'Shot Put',sport:'throw',kind:'shot'},
 {name:'High Jump',sport:'highjump'},{name:'Relay 4 × 100',sport:'relay'},{name:'Javelin',sport:'throw',kind:'javelin'},{name:'400 m',sport:'sprint'},
 {name:'Triple Jump',sport:'triplejump'},{name:'Discus',sport:'throw',kind:'discus'},{name:'Pole Vault',sport:'polevault'},{name:'800 m',sport:'sprint'},
 {name:'Steeplechase',sport:'steeple'},{name:'1500 m',sport:'distance',n:20},{name:'Marathon',sport:'distance',n:25}];
const CLASSES={
  J1T:{label:'J1T',year:'Year 7',book:"Learner's Book 7",lb:'LB7',units:Y7},
  J2T:{label:'J2T',year:'Year 8',book:"Learner's Book 8",lb:'LB8',units:Y8},
  J3T:{label:'J3T',year:'Year 9',book:"Learner's Book 9",lb:'LB9',units:Y9,calc:true},
};
const UNIT={};
for(const k in CLASSES)CLASSES[k].units.forEach((u,i)=>{
  u.id=k+'-'+u.n;u.cls=k;u.t=BOOK[k].units[u.n];u.event=EVENTS[i];u.ev=EVENTS[i].name;
  u.secs=Object.keys(BOOK[k].secs).filter(s=>s.split('.')[0]===String(u.n));
  u.bySec={};u.g.forEach((g,gi)=>{(u.bySec[g.sec]=u.bySec[g.sec]||[]).push(gi)});
  u.covered=u.secs.filter(s=>u.bySec[s]);UNIT[u.id]=u;
});
const secTitle=(cls,sec)=>BOOK[cls].secs[sec]||'';
/* One question from generator gi of unit u, with its LB section attached */
function genQ(u,gi,L,ctx){
  for(let t=0;t<25;t++){try{const q=u.g[gi](L,ctx||{});if(q&&q.opts&&q.opts.length>=2&&q.opts.includes(q.a)){q.uid=u.id;q.gi=gi;q.sec=u.g[gi].sec;q.L=L;q.unit=`Unit ${u.n} · ${u.t}`;return q}}catch(e){}}
  return null;
}
function makeQuestion(u,L,ctx,sec){
  const secs=sec&&u.bySec[sec]?[sec]:u.covered;
  for(let t=0;t<20;t++){const s=P(secs),q=genQ(u,P(u.bySec[s]),L,ctx);if(q)return q}
  return null;
}
/* n different questions from one unit, spread across all its LB sections */
function unitSet(u,L,n,ctx,levelAt){
  const out=[],seen=new Set();let order=[],tries=0;
  while(out.length<n&&tries++<n*40){if(!order.length)order=shuffle([...u.covered]);const s=order.pop(),q=makeQuestion(u,levelAt?levelAt(out.length):L,ctx,s);if(q&&!seen.has(q.q)){seen.add(q.q);out.push(q)}}
  return out;
}
/* n different questions spread across several units */
function mixedSet(units,n,ctx,levelAt){
  const out=[],seen=new Set();let order=[],tries=0;
  while(out.length<n&&tries++<n*40){if(!order.length)order=shuffle([...units]);const u=order.pop(),q=makeQuestion(u,levelAt?levelAt(out.length):2,ctx);if(q&&!seen.has(q.q)){seen.add(q.q);out.push(q)}}
  return out;
}
/* A fresh question of the same type, for "try a similar one" and the notebook */
function similarQ(uid,gi,L,ctx,avoid){const u=UNIT[uid];if(!u||!u.g[gi])return null;for(let t=0;t<12;t++){const q=genQ(u,gi,L,ctx);if(q&&q.q!==avoid)return q}return null}
if(typeof module!=='undefined')module.exports={CLASSES,UNIT,BOOK,EVENTS,makeQuestion,genQ,unitSet,mixedSet,similarQ,fmt,secTitle,D,nv};

<script>
/* Maths Track & Field — original sound effects and music, made with the Web Audio API.
   No audio files: nothing to download, works offline, no copyright questions.
   On iPhones the session is set to "ambient", so the ring/silent switch mutes it. */
const Sound=(()=>{
  let ctx=null,master,sfxBus,musicBus,noiseBuf=null;
  const set={sfx:true,music:false,quiet:false,vibe:true};
  function ready(){
    if(set.quiet)return false;
    if(!ctx){
      try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;
        try{if(navigator.audioSession)navigator.audioSession.type='ambient'}catch(e){}
        ctx=new AC();master=ctx.createGain();master.gain.value=0.9;master.connect(ctx.destination);
        sfxBus=ctx.createGain();sfxBus.gain.value=0.55;sfxBus.connect(master);
        musicBus=ctx.createGain();musicBus.gain.value=0.16;musicBus.connect(master);
      }catch(e){ctx=null;return false}
    }
    if(ctx.state==='suspended')ctx.resume().catch(()=>{});
    return true;
  }
  function tone(f,t,dur,type,gain,bus,attack){
    const o=ctx.createOscillator(),g=ctx.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(gain||0.3,t+(attack||0.005));g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g);g.connect(bus||sfxBus);o.start(t);o.stop(t+dur+0.03);return o;
  }
  function noise(){if(!noiseBuf){const len=ctx.sampleRate;noiseBuf=ctx.createBuffer(1,len,ctx.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1}return noiseBuf}
  function burst(t,dur,gain,type,freq,q,bus){
    const s=ctx.createBufferSource();s.buffer=noise();const f=ctx.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=q||1;
    const g=ctx.createGain();g.gain.setValueAtTime(Math.max(gain,0.0001),t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    s.connect(f);f.connect(g);g.connect(bus||sfxBus);s.start(t,Math.random()*0.4);s.stop(t+dur+0.03);return {f,g};
  }
  function brass(f,t,l){
    const o=ctx.createOscillator();o.type='sawtooth';o.frequency.value=f;const lp=ctx.createBiquadFilter();lp.type='lowpass';
    lp.frequency.setValueAtTime(500,t);lp.frequency.linearRampToValueAtTime(2200,t+0.05);lp.frequency.linearRampToValueAtTime(1100,t+l);
    const g=ctx.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.2,t+0.03);g.gain.setValueAtTime(0.2,t+Math.max(0.04,l-0.05));g.gain.exponentialRampToValueAtTime(0.0001,t+l+0.18);
    o.connect(lp);lp.connect(g);g.connect(sfxBus);o.start(t);o.stop(t+l+0.25);
  }
  const FX={
    pistol:t=>{burst(t,0.4,0.9,'highpass',900);burst(t,0.15,0.9,'lowpass',260);tone(85,t,0.3,'sine',0.5)},
    correct:t=>{tone(660,t,0.18,'triangle',0.32);tone(990,t+0.09,0.3,'triangle',0.28)},
    wrong:t=>{const o=tone(220,t,0.34,'sine',0.32);o.frequency.exponentialRampToValueAtTime(150,t+0.3)},
    steps:(t,n,gap)=>{for(let i=0;i<n;i++)burst(t+i*gap,0.05,0.45,'bandpass',i%2?950:720,3)},
    bell:t=>{for(const k of [0,0.42])for(const [f,g] of [[880,0.28],[1760,0.1],[2637,0.05]])tone(f,t+k,1.1,'sine',g)},
    cheer:(t,big)=>{const L=big?2.4:1.4,{g}=burst(t,L,0.0001,'bandpass',1400,0.6);g.gain.cancelScheduledValues(t);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(big?0.45:0.28,t+0.35);g.gain.exponentialRampToValueAtTime(0.0001,t+L);
      for(let i=0;i<(big?16:8);i++)burst(t+0.15+Math.random()*(L-0.5),0.04,0.3,'highpass',1800)},
    fanfare:t=>{[[523,0,0.16],[659,0.17,0.16],[784,0.34,0.16],[1047,0.52,0.65]].forEach(([f,d,l])=>brass(f,t+d,l))},
    medal:t=>{[523,659,784].forEach(f=>tone(f,t,0.9,'triangle',0.16))},
    soft:t=>{[392,494,587].forEach(f=>tone(f,t,1,'triangle',0.1))},
    level:t=>{[523,659,784,988,1175].forEach((f,i)=>tone(f,t+i*0.08,0.28,'triangle',0.22))},
    power:t=>{tone(880,t,0.12,'square',0.1);tone(1320,t+0.08,0.22,'square',0.1)},
    baton:t=>{tone(500,t,0.08,'triangle',0.24);tone(760,t+0.07,0.14,'triangle',0.24)},
    tap:t=>{tone(1200,t,0.04,'sine',0.06)},
  };
  function play(name,...a){if(!set.sfx||!ready())return;try{FX[name](ctx.currentTime+0.01,...a)}catch(e){}}

  /* Music: a small step sequencer. Menu: calm pads at 84 bpm. Race: drums and bass at 118 bpm, 138 bpm near the finish. */
  const PROG=[[57,60,64],[53,57,60],[48,52,55],[55,59,62]],mtof=m=>440*Math.pow(2,(m-69)/12);
  let timer=null,mode=null,bpm=84,beat=0,nextT=0,level=0;
  function kick(t){const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(45,t+0.12);g.gain.setValueAtTime(0.3,t);g.gain.exponentialRampToValueAtTime(0.0001,t+0.15);o.connect(g);g.connect(musicBus);o.start(t);o.stop(t+0.17)}
  function hat(t){burst(t,0.035,0.08,'highpass',7000,1,musicBus)}
  function step(b,t,spb){
    const ch=PROG[Math.floor(b/8)%4],e=b%8;
    if(mode==='menu'){if(e===0)ch.forEach(m=>tone(mtof(m),t,spb*7.6,'sine',0.05,musicBus,0.35));if(e%2===0)tone(mtof(ch[(e/2)%3]+12),t,spb*1.7,'triangle',0.03,musicBus,0.01);return}
    if(e%2===0)kick(t);if(e%2===1||level>=2)hat(t);
    tone(mtof(ch[0]-12),t,spb*0.85,'square',0.035,musicBus,0.004);
    if(level>=1&&e%2===0)tone(mtof(ch[(e/2)%3]+12),t,spb*0.8,'triangle',0.028,musicBus,0.004);
  }
  function tick(){if(!ctx||!mode)return;const spb=60/bpm/2;while(nextT<ctx.currentTime+0.12){step(beat,nextT,spb);nextT+=spb;beat=(beat+1)%64}}
  function stop(){if(timer){clearInterval(timer);timer=null}}
  function music(m){mode=m;if(!m||!set.music||document.hidden||!ready()){stop();return}bpm=m==='menu'?84:(level>=2?138:118);if(!timer){nextT=ctx.currentTime+0.1;beat=0;timer=setInterval(tick,25)}}
  function intensity(l){level=l;if(mode==='race')bpm=l>=2?138:118}
  document.addEventListener('visibilitychange',()=>{if(document.hidden)stop();else if(mode)music(mode)});
  function apply(s){Object.assign(set,s);if(!set.music||set.quiet)stop();else if(mode)music(mode)}
  function buzz(p){if(set.vibe&&navigator.vibrate)try{navigator.vibrate(p)}catch(e){}}
  return {play,music,intensity,apply,buzz,unlock:()=>{if(set.sfx||set.music)ready()}};
})();

(function(){

const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CFG=Object.assign({boardUrl:'',boardKey:'',houses:['Red','Blue','Green','Yellow']},window.MTF_CONFIG||{});

/* ---------- dates: local day numbers, weeks start on Monday ---------- */
const DAY=864e5;
const dayNum=(d=new Date())=>Math.floor((d.getTime()-d.getTimezoneOffset()*6e4)/DAY);
const weekOf=n=>Math.floor((n+3)/7), wday=n=>((n+3)%7+7)%7;
const dayStart=n=>{const t=n*DAY;return t+new Date(t).getTimezoneOffset()*6e4};
const dayLabel=n=>new Date(dayStart(n)+12*36e5).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
const parseDay=s=>{const m=String(s).match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);return m?dayNum(new Date(+m[1],m[2]-1,+m[3],12)):null};

/* Older versions stored dates as text and best results as {s,t}. */
function legacy(p){
  if(typeof p.lastDay==='string')p.lastDay=parseDay(p.lastDay);
  if(typeof p.daily==='string')p.daily=parseDay(p.daily);
  if(p.best&&typeof p.best==='object')for(const k in p.best)if(Array.isArray(p.best[k]))p.best[k]=p.best[k].map(r=>r&&r.c==null&&r.s!=null?{c:+r.s||0,n:10,v:isFinite(+r.t)?+r.t:null,k:'time',splits:[]}:r);
  return p;
}
function fixPlayer(p){
  legacy(p);
  const d={xp:0,best:{},champ:{},streak:0,lastDay:null,restWeek:null,daily:null,days:[],missed:[],races:0,answered:0,correct:0,bestStreak:0,tokens:1,pwUsed:0,typedRight:0,nbCleared:0,relays:0,pbs:0,events:{},badges:{},kit:'forest',fit:{},week:{id:0,xp:0},board:{on:false,nick:'',house:'',token:''},tutorial:false};
  for(const k in d)if(p[k]===undefined||(p[k]===null&&d[k]!==null))p[k]=d[k];
  p.missed=p.missed.map(m=>Object.assign({box:0,due:0},m));
  return p;
}

/* ---------- streak: school days count; weekends never break it; one rest day each week ---------- */
function streakCheck(p,t){
  if(p.lastDay==null)return {alive:false,missed:0,restDay:null};
  if(p.lastDay>=t)return {alive:true,missed:0,restDay:null};
  let missed=0,restDay=null;for(let d=p.lastDay+1;d<t;d++)if(wday(d)<5){missed++;restDay=d}
  if(missed===0)return {alive:true,missed,restDay:null};
  if(missed===1&&p.restWeek!==weekOf(restDay))return {alive:true,missed,restDay};
  return {alive:false,missed,restDay:null};
}
function playToday(p){
  const t=dayNum();if(p.lastDay===t)return null;const c=streakCheck(p,t);let note=null;
  if(c.alive){p.streak=(p.streak||0)+1;if(c.restDay!=null){p.restWeek=weekOf(c.restDay);note=`You missed ${dayLabel(c.restDay)}, so it became your rest day for that week. Your streak is safe.`}}else p.streak=1;
  p.lastDay=t;p.days=[...(p.days||[]).filter(d=>d>t-28&&d!==t),t];return note;
}
const streakShown=p=>streakCheck(p,dayNum()).alive?p.streak:0;
function addXP(p,n){const w=weekOf(dayNum());if(p.week.id!==w)p.week={id:w,xp:0};p.xp+=n;p.week.xp+=n}

/* Stadium map: the units sit around a running track, clockwise from the top left */
function stationXY(k,N){
  const cx=170,cy=250,Ls=110,r=122,per=4*Ls+2*Math.PI*r;let d=(k+0.5)/N*per;
  if(d<Math.PI*r){const a=Math.PI-d/r;return [cx+r*Math.cos(a),cy-Ls-r*Math.sin(a)]}d-=Math.PI*r;
  if(d<2*Ls)return [cx+r,cy-Ls+d];d-=2*Ls;
  if(d<Math.PI*r){const a=d/r;return [cx+r*Math.cos(a),cy+Ls+r*Math.sin(a)]}d-=Math.PI*r;
  return [cx-r,cy+Ls-d];
}
const stadium=(cx,cy,Ls,r)=>`M${cx-r} ${cy+Ls}V${cy-Ls}A${r} ${r} 0 0 1 ${cx+r} ${cy-Ls}V${cy+Ls}A${r} ${r} 0 0 1 ${cx-r} ${cy+Ls}Z`;
const pipsHTML=(p,u)=>[0,1,2].map(r=>{const m=medalOf(bestOf(p,u,r));return `<i class="pip ${m}${!m&&!unlocked(p,u,r)?' lock':''}"></i>`}).join('');
function mapHTML(p,c){
  const N=c.units.length,t=tally(p),done=p.daily===dayNum();
  let h=`<div class="map"><svg class="map-bg" viewBox="0 0 340 500" aria-hidden="true"><path class="m-track" d="${stadium(170,250,110,148)}"/><path class="m-lane" d="${stadium(170,250,110,113)}"/><path class="m-lane" d="${stadium(170,250,110,131)}"/><path class="m-field" d="${stadium(170,250,110,96)}"/><path class="m-start" d="M22 140h52"/></svg>`;
  c.units.forEach((u,k)=>{const [x,y]=stationXY(k,N),rec=[0,1,2].map(r=>medalOf(bestOf(p,u,r))),best=rec.includes('g')?'g':rec.includes('s')?'s':rec.includes('b')?'b':'',n=rec.filter(Boolean).length;
    h+=`<button class="st ${best}" type="button" data-u="${u.id}" style="left:${(x/340*100).toFixed(2)}%;top:${(y/500*100).toFixed(2)}%" aria-label="Unit ${u.n}, ${esc(u.t)}, ${esc(u.ev)}. ${n} of 3 rounds with a medal."><b>${u.n}</b><span class="mini">${pipsHTML(p,u)}</span></button>`});
  h+=`<div class="infield"><span class="lab">${esc(c.label)} · ${esc(c.book)}</span><b class="num big">${t.g+t.s+t.b}<small> / ${N*3}</small></b><span class="small">medals won</span>
    <button class="btn primary sm" type="button" id="b-relay">${done?'Daily Relay':'Daily Relay · 2× XP'}</button><button class="btn sm light" type="button" id="b-champ">Championship</button></div></div>
    <p class="muted small center">Tap a number to open that unit's event.</p>`;
  return h;
}
function listHTML(p,c){

  let h=`<button class="relay${done?' done':''}" id="b-relay" type="button"><span class="baton"><i></i></span><span><h2>Daily Relay</h2><p>${done?'Done today. Play again for normal XP, or come back tomorrow for double XP.':'4 legs from 4 different units. Double XP once a day.'}</p></span></button>
    <button class="relay champ" id="b-champ" type="button"><span class="baton cup"><i></i></span><span><h2>Championship</h2><p>20 questions from many units, from easy to hard, like an exam paper.</p></span></button><div class="events">`;

/* ---------- notebook: spaced practice (ready now, then back after 1, 3 and 7 days) ---------- */
const GAPS=[1,3,7];
function noteMiss(p,q){
  const ex=p.missed.find(m=>m.uid&&m.uid===q.uid&&m.gi===q.gi),now=Date.now();
  const item={q:q.q,a:q.a,opts:q.opts,tip:q.tip,unit:q.unit,uid:q.uid,gi:q.gi,L:q.L,sec:q.sec,box:0,due:now,at:now};
  if(ex){Object.assign(ex,item);return false}
  p.missed.push(item);if(p.missed.length>60)p.missed.shift();return true;
}
function noteResult(p,item,ok){
  if(ok){item.box=(item.box||0)+1;if(item.box>3){const i=p.missed.indexOf(item);if(i>=0)p.missed.splice(i,1);p.nbCleared++;return 'cleared'}item.due=dayStart(dayNum()+GAPS[item.box-1]);return 'later'}
  item.box=0;item.due=dayStart(dayNum()+1);return 'again';
}

/* ---------- save codes ---------- */
/* A save code is the athlete's data plus a check value, so an edited code is refused (this stops casual editing; it is not strong security). */
const SALT='mtf-track-and-field-2026';
function hash(s){let h=0x811c9dc5;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0}return h.toString(36)}
function exportCode(p){
  const missed=p.missed.slice(-30).map(m=>m.uid?{uid:m.uid,gi:m.gi,L:m.L,box:m.box,due:m.due,at:m.at}:m);
  const json=JSON.stringify({...p,missed});return 'MTF2.'+btoa(unescape(encodeURIComponent(json)))+'.'+hash(SALT+json);
}
/* Only the maths markup the question bank itself makes may come in from a save code. */
const ALLOWED={I:1,B:1,SUP:1,SPAN:1,TABLE:1,TBODY:1,TR:1,TD:1,TH:1,DIV:1,BR:1};
function cleanHTML(h){
  const t=document.createElement('template');t.innerHTML=String(h==null?'':h).slice(0,4000);
  (function walk(n){[...n.childNodes].forEach(c=>{
    if(c.nodeType===1){
      if(!ALLOWED[c.tagName]){c.replaceWith(document.createTextNode(c.textContent));return}
      for(const a of [...c.attributes])if(a.name!=='class'||!/^[a-z0-9 -]{1,30}$/.test(a.value))c.removeAttribute(a.name);
      walk(c);
    }else if(c.nodeType!==3)c.remove();
  })})(t.content);
  return t.innerHTML;
}
const int=(v,max=1e9)=>{v=Math.floor(+v);return isFinite(v)&&v>=0?Math.min(v,max):0};
const intOrNull=(v,max)=>v==null||v===''||!isFinite(+v)?null:int(v,max);
function cleanRec(r){
  if(!r||typeof r!=='object')return null;const n=int(r.n,60);if(!n)return null;
  return {c:Math.min(int(r.c),n),n,v:r.v==null||!isFinite(+r.v)?null:Math.max(0,Math.min(+r.v,36e6)),k:['time','h','d'].includes(r.k)?r.k:'time',splits:Array.isArray(r.splits)?r.splits.slice(0,40).map(x=>int(x,36e6)):[]};
}
function cleanPlayer(raw){
  const p=legacy(raw);
  const q=fixPlayer({id:String(p.id||'').replace(/[^\w]/g,'').slice(0,40)||('p'+Date.now().toString(36)),name:String(p.name).trim().slice(0,24)||'Athlete',cls:p.cls,created:int(p.created)||Date.now()});
  for(const k of ['xp','races','answered','correct','pwUsed','typedRight','nbCleared','relays','pbs'])q[k]=int(p[k]);
  q.streak=int(p.streak,10000);q.bestStreak=int(p.bestStreak,1000);q.tokens=Math.min(3,int(p.tokens));q.correct=Math.min(q.correct,q.answered);
  q.lastDay=intOrNull(p.lastDay,1e6);q.daily=intOrNull(p.daily,1e6);q.restWeek=intOrNull(p.restWeek,1e6);
  q.days=Array.isArray(p.days)?p.days.slice(-30).map(d=>int(d,1e6)):[];
  q.kit=KITS.some(k=>k.id===p.kit)?p.kit:'forest';q.tutorial=!!p.tutorial;
  for(const k in (p.best||{}))if(UNIT[k]&&Array.isArray(p.best[k]))q.best[k]=[0,1,2].map(i=>cleanRec(p.best[k][i]));
  for(const k in (p.champ||{}))if(/^J[123]T-(mid|all)-p[12]$/.test(k))q.champ[k]=cleanRec(p.champ[k]);
  for(const k in (p.events||{}))if(UNIT[k])q.events[k]=1;
  for(const [id] of BADGES)if(p.badges&&p.badges[id])q.badges[id]=int(p.badges[id])||1;
  for(const c in (p.fit||{}))if(CLASSES[c]&&p.fit[c]&&typeof p.fit[c]==='object'){q.fit[c]={};for(const s in p.fit[c])if(BOOK[c].secs[s]&&Array.isArray(p.fit[c][s])){const a=Math.max(0,Math.min(+p.fit[c][s][0]||0,1e4)),n=Math.max(0,Math.min(+p.fit[c][s][1]||0,1e4));q.fit[c][s]=[Math.min(a,n),n]}}
  q.week={id:int(p.week&&p.week.id,1e6),xp:int(p.week&&p.week.xp)};
  const b=p.board||{};q.board={on:!!b.on,nick:String(b.nick||'').replace(/[\u0000-\u001f]/g,'').slice(0,20),house:CFG.houses.includes(b.house)?b.house:'',token:String(b.token||'').replace(/[^\w]/g,'').slice(0,40)};
  if(q.board.on&&!q.board.token)q.board.on=false;
  for(const m of (Array.isArray(p.missed)?p.missed:[]).slice(-60)){
    if(!m||typeof m!=='object')continue;
    const box=Math.min(3,int(m.box)),due=int(m.due,1e14),at=int(m.at,1e14);
    if(UNIT[m.uid]&&UNIT[m.uid].g[int(m.gi)]){ /* a fresh question of the same type, made on this phone */
      const L=Math.min(3,Math.max(1,int(m.L)||2)),fresh=similarQ(m.uid,int(m.gi),L,{});
      if(fresh)q.missed.push({q:fresh.q,a:fresh.a,opts:fresh.opts,tip:fresh.tip,unit:fresh.unit,uid:fresh.uid,gi:fresh.gi,L,sec:fresh.sec,box,due,at});
      continue;
    }
    if(!Array.isArray(m.opts))continue;const opts=m.opts.slice(0,4).map(cleanHTML),a=cleanHTML(m.a);if(!opts.includes(a))continue;
    q.missed.push({q:cleanHTML(m.q),a,opts,tip:String(m.tip||'').slice(0,300),unit:String(m.unit||'').slice(0,80),box,due,at});
  }
  return q;
}
function importCode(code){
  code=code.trim().replace(/\s+/g,'');const m=code.match(/^MTF2\.([A-Za-z0-9+/=]+)\.([a-z0-9]+)$/);if(!m)throw new Error('format');
  const json=decodeURIComponent(escape(atob(m[1])));if(hash(SALT+json)!==m[2])throw new Error('changed');
  const p=JSON.parse(json);if(!p||typeof p.name!=='string'||!CLASSES[p.cls])throw new Error('data');
  return cleanPlayer(p);
}
function openRestore(){
  openSheet(`<h2>Load a save code</h2><p class="muted" style="margin:0">Paste the code you copied from your old phone. It starts with MTF2.</p><textarea id="in-code" aria-label="Save code"></textarea><p class="warn" id="code-err" hidden></p><div class="row"><button class="btn" type="button" data-close>Cancel</button><button class="btn primary" type="button" id="b-load">Load</button></div>`);
  $('#b-load').onclick=()=>{try{const p=importCode($('#in-code').value);DB.players[p.id]=p;DB.cur=p.id;save();closeSheet();tab='events';goHome();toast('Welcome back, '+p.name+'!')}catch(e){const er=$('#code-err');er.textContent=e.message==='changed'?'This code has been changed since it was copied, so it cannot be loaded. Copy it again from the Me tab on the old phone.':'That code did not work. Check you copied all of it, including MTF2. at the start.';er.hidden=false}};
}

/* ---------- class leaderboard: a Google Sheet through an Apps Script web app ---------- */
const boardOn=()=>/^https:\/\/\S+$/.test(CFG.boardUrl||'')||/^http:\/\/(localhost|127\.0\.0\.1)(:\d+)?\/\S*$/.test(CFG.boardUrl||'');
function summary(p){
  const t=tally(p),f=p.fit[p.cls]||{},sections={};for(const s in f)if(f[s][1]>=2.5)sections[s]=Math.round(f[s][0]/f[s][1]*100);
  const w=weekOf(dayNum());
  return {id:p.id,name:p.board.nick||p.name.split(' ')[0],cls:p.cls,house:p.board.house||'',xp:p.xp,week:w,weekXP:p.week.id===w?p.week.xp:0,gold:t.g,silver:t.s,bronze:t.b,races:p.races,accuracy:p.answered?Math.round(p.correct/p.answered*100):0,streak:streakShown(p),bestStreak:p.bestStreak||0,badges:Object.keys(p.badges).length,level:levelOf(p.xp),kit:p.kit,sections,version:VERSION};
}
async function post(body){const r=await fetch(CFG.boardUrl,{method:'POST',body:JSON.stringify(Object.assign({key:CFG.boardKey||''},body))});const j=await r.json();if(!j.ok)throw new Error(j.error||'refused');return j}

async function boardSend(){const p=me();if(!p||!boardOn()||!p.board.on)return;p.board.pending=true;save();if(sending)return;sending=true;
  try{await post({action:'save',token:p.board.token,athlete:summary(p)});p.board.pending=false;p.board.sent=Date.now();p.board.err='';save()}
  catch(e){p.board.err=String(e.message||'offline').slice(0,40);save();if(!retryT&&/slow|busy/.test(p.board.err))retryT=setTimeout(()=>{retryT=null;boardFlush()},15000)}finally{sending=false}}
function boardFlush(){const p=me();if(p&&p.board&&p.board.on&&p.board.pending)boardSend()}
async function boardRemove(p){if(!boardOn()||!p.board.on)return;try{await post({action:'remove',id:p.id,token:p.board.token})}catch(e){}}

/* ---------- calculator (Championship Paper 2) ---------- */
const Calc=(()=>{
  let ex='',done=null;
  function evaluate(s){
    const tk=[],re=/(\d+\.?\d*|\.\d+|π|√|[-+×÷^()²−])/y;let m;re.lastIndex=0;s=s.replace(/\s+/g,'');while(re.lastIndex<s.length){m=re.exec(s);if(!m)throw 0;tk.push(m[1]==='-'?'−':m[1])}
    let i=0;const peek=()=>tk[i],take=()=>tk[i++];
    function E(){let v=T();while(peek()==='+'||peek()==='−'){const o=take(),w=T();v=o==='+'?v+w:v-w}return v}
    function T(){let v=U();for(;;){const t=peek();if(t==='×'||t==='÷'){take();const w=U();v=t==='×'?v*w:v/w}else if(t==='('||t==='π'||t==='√')v*=U();else return v}}
    function U(){if(peek()==='−'){take();return -U()}return Pw()}
    function Pw(){const v=Po();if(peek()==='^'){take();return Math.pow(v,U())}return v}
    function Po(){let v=Pr();while(peek()==='²'){take();v=v*v}return v}
    function Pr(){const t=take();if(t===undefined)throw 0;if(t==='π')return Math.PI;if(t==='√'){const v=Po();if(v<0)throw 0;return Math.sqrt(v)}if(t==='('){const v=E();if(peek()===')')take();return v}if(/^[\d.]/.test(t))return parseFloat(t);throw 0}
    const v=E();if(i!==tk.length||!isFinite(v))throw 0;return v;
  }
  const out=v=>String(+v.toPrecision(10)).replace(/^-/,'−');
  function show(res){$('#calc-ex').textContent=ex||'0';$('#calc-res').textContent=res==null?'':res}
  function press(k){
    if(k==='AC'){ex='';done=null;return show()}
    if(k==='⌫'){if(done!=null){ex='';done=null}else ex=ex.slice(0,-1);return show()}
    if(k==='='){try{done=evaluate(ex);show('= '+out(done))}catch(e){done=null;show('Check the calculation')}return}
    if(done!=null){ex=/^[+−×÷^²]$/.test(k)?out(done)+k:k;done=null}else ex+=k;
    show();
  }
  return {press,evaluate,open(){$('#calc').hidden=false;document.body.classList.add('calc-open');show()},close(){$('#calc').hidden=true;document.body.classList.remove('calc-open')}};
})();
$('#calc').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.k){Sound.play('tap');Calc.press(b.dataset.k)}if(b.id==='calc-x')Calc.close()});

}
function usePower(kind,q){

/* answering */
function answer(q,ok,btn,typedVal){
  const r=race,p=me();if(!r||q.done)return;

  if(!ok&&r.pw.armed==='second'&&!q.practice){r.pw.armed=null;q.second=true;Sound.play('wrong');Sound.buzz([40,30,40]);
    if(btn){btn.disabled=true;btn.classList.add('wrong')}else drawPad(q);
    toast('Second chance! Try again.');drawPower(q);return}
  q.done=true;pause();
  $$('#r-opts .opt').forEach(b=>{b.disabled=true;if(q.opts[+b.dataset.k]===q.a)b.classList.add('right')});
  if(btn&&!ok)btn.classList.add('wrong');
  $('#r-pw').hidden=true;
  if(q.practice){Sound.play(ok?'correct':'wrong');Sound.buzz(ok?30:[60,40,60]);showFeedback(q,ok,ok?'You have got it. Back to the race!':'',0,typedVal);return}
  r.asked++;p.answered++;

  else if(!ok&&q.uid&&r.mode!=='tutorial'&&noteMiss(p,q))r.missedNew++;
  let gain=0;
  if(ok){const base=r.mode==='tutorial'?0:r.mode==='notebook'?10:r.mode==='sec'?5:10*(q.L||r.L||2);
    gain=r.mode==='tutorial'?0:base+(r.streak>=3?5:0)+(secs<12&&!q.second?5:0);

  }

}
function showFeedback(q,ok,note,gain,typedVal){

  const lines=[];

$('#b-next').onclick=()=>{const r=race;if(!r)return;if(r.extra)r.extra=null;resume();nextQ()};

/* sport mechanics: what each answer does */
function mech(ok,secs,q){
  const r=race,s=r.st,fast=ok&&secs<12&&!q.second;
  if(r.kind==='track'){const sp=r.sp,i=r.asked-1;if(!ok&&sp.pen){const water=!!(sp.water&&sp.water.includes(i)),add=water?sp.wpen:sp.pen;r.penalty+=add;return water?`Splash! Wrong at the water jump: +${add/1000} s.`:`You knocked the ${r.sport==='steeple'?'barrier':'hurdle'}: +${add/1000} s.`}return ''}
  if(r.kind==='height'){if(ok){s.best=s.h;s.clears++;const m=`Cleared ${metres(s.h)}!`;s.h+=r.sp.step;s.miss=0;if(s.clears>=10){r.flags.allHeights=true;return m+' You cleared every height.'}return `${m} The bar goes up to ${metres(s.h)}.`}
    s.miss++;if(s.miss>=3){s.out=true;return `Third miss at ${metres(s.h)}. Your competition is over.`}return `Miss ${s.miss} at ${metres(s.h)}. ${3-s.miss} ${3-s.miss>1?'tries':'try'} left.`}
  if(s.rq)s.rq.push(ok);
  if(r.kind==='jump'){
    if(s.q<3){if(ok){s.run++;if(fast)s.fast++}s.q++;return s.q<3?(ok?'Good run-up: more speed.':'A slower run-up.'):'Now the take-off at the board!'}
    let m;if(ok){const d=400+85*s.run+12*s.fast;s.res.push(d);m=`Jump ${s.att+1}: ${metres(d)}!`}else{s.res.push(null);m=`Foul at the board: jump ${s.att+1} does not count.`}
    s.att++;s.q=0;s.run=0;s.fast=0;s.rq=[];return m}
  if(r.kind==='triple'){const part=[420,340,440][s.q];s.dist+=ok?part+(fast?30:0):Math.round(part*0.45);s.q++;
    if(s.q===3){s.res.push(s.dist);const m=`Jump ${s.att+1}: ${metres(s.dist)}.`;s.att++;s.q=0;s.dist=0;s.rq=[];return m}return ok?(s.q===1?'Good hop!':'Good step!'):(s.q===1?'A short hop.':'A short step.')}
  if(r.kind==='throw'){if(ok)s.pow+=fast?1.2:1;s.q++;if(s.q===4){const d=s.pow>0?Math.round(s.max*100*(0.2+0.8*s.pow/4.8)):null;s.res.push(d);const m=d?`Throw ${s.att+1}: ${metres(d)}!`:`Throw ${s.att+1}: no power, so no throw.`;s.att++;s.q=0;s.pow=0;s.rq=[];return m}return ok?'More power!':'No extra power.'}
  return '';
}
function result(){
  const r=race,s=r.st;
  if(r.kind==='height')return {c:s.clears,n:10,v:s.best,k:'h'};
  if(r.kind!=='track'){const b=Math.max(0,...s.res.filter(x=>x!=null));return {c:r.correct,n:r.total,v:b||null,k:'d',series:s.res}}
  return {c:r.correct,n:r.total,v:elapsed()+r.penalty,k:'time',splits:r.splits};
}
const better=(a,b)=>{if(!b)return true;const fa=a.c/a.n,fb=b.c/b.n;if(Math.abs(fa-fb)>1e-9)return fa>fb;if(a.k!==b.k)return true;if(a.v==null)return false;if(b.v==null)return true;return a.k==='time'?a.v<b.v:a.v>b.v};
const realPB=(a,b)=>!!b&&(a.k===b.k||a.c/a.n>b.c/b.n+1e-9);

/* the picture above each question */
function moveGhost(){const g=$('#r-ghost');if(!g||!race||!race.pb||!race.pb.splits||!race.pb.splits.length)return;const e=elapsed(),sp=race.pb.splits,n=race.total;let k=0;while(k<sp.length&&sp[k]<=e)k++;const prev=k?sp[k-1]:0,nxt=sp[k];let pos=k;if(nxt!=null)pos+=Math.min(1,(e-prev)/Math.max(1,nxt-prev))*0.98;g.style.left=(4+Math.min(pos,n)/n*90)+'%'}
function drawVis(){

  if(r.kind==='jump'||r.kind==='triple'){const max=r.kind==='jump'?800:1500,X=v=>Math.round(122+Math.min(v,max)/max*196),pb=r.pb&&r.pb.v;

    el.innerHTML=`<svg class="sv" viewBox="0 0 340 92" role="img" aria-label="Your throws so far"><rect class="field" x="40" y="44" width="282" height="32" rx="4"/>${ticks}<circle class="ring" cx="26" cy="60" r="10"/>${pb?`<circle class="pbc" cx="${X(pb)}" cy="60" r="8"/>`:''}${s.res.map((d,i)=>d?`<circle class="mk" cx="${X(d)}" cy="${52+i*8}" r="5" style="fill:${k.a}"/>`:'').join('')}<g>${[0,1,2,3].map(i=>`<rect class="pow${i<s.rq.length?(s.rq[i]?' on':' miss'):''}" x="${10+i*16}" y="8" width="12" height="18" rx="2"/>`).join('')}</g><text class="t s" x="80" y="22">Throw ${Math.min(3,s.att+1)} of 3 · power</text></svg>`;}

/* ---------- finish ---------- */
function finish(){
  clearInterval(clockT);Calc.close();padKeys=null;const r=race,p=me(),before=levelOf(p.xp);Sound.intensity(0);
  if(r.mode==='tutorial'){addXP(p,20);p.tutorial=true;playToday(p);save();showTutorialDone();return}
  const res=result(),m=medalOf(res),showMedal=['event','champ','daily'].includes(r.mode),newBadges=[];let pb=false,unlockedNext=false,bonus=0;
  if(r.mode==='event'){const u=r.unit;p.best[u.id]=p.best[u.id]||[null,null,null];const old=p.best[u.id][r.round];
    if(better(res,old)){p.best[u.id][r.round]={c:res.c,n:res.n,v:res.v,k:res.k,splits:res.splits||[]};if(realPB(res,old)){pb=true;p.pbs++;bonus+=20}}
    unlockedNext=r.round<2&&!!m&&!medalOf(old);
    if(m&&(!old||(medalOf(old)!==m&&res.c/res.n>old.c/old.n)))bonus+={g:50,s:30,b:15}[m];
    if(m==='g'&&old&&!medalOf(old))r.flags.comeback=true;
    p.events[u.id]=1;if(u.event.sport==='distance')r.flags.distance=true;
  }
  if(r.mode==='champ'){const old=p.champ[r.key];if(better(res,old)){p.champ[r.key]={c:res.c,n:res.n,v:res.v,k:res.k,splits:res.splits||[]};pb=realPB(res,old)}if(m&&(!old||(medalOf(old)!==m&&res.c/res.n>old.c/old.n)))bonus+={g:100,s:60,b:30}[m];if(m==='g')r.flags.champGold=true}
  if(r.mode==='daily'){p.daily=dayNum();p.relays++}
  addXP(p,r.xp+bonus);p.races++;p.bestStreak=Math.max(p.bestStreak||0,r.best);
  const restNote=playToday(p);
  for(const [id] of BADGES)if(!p.badges[id]&&badgeTest(id,p,r)){p.badges[id]=Date.now();newBadges.push(id)}
  save();boardSend();
  const after=levelOf(p.xp),label=r.mode==='event'?`${r.evName} · ${r.unit.t} · ${ROUNDS[r.round]}`:r.mode==='champ'?`Championship · ${r.sub}`:r.mode==='sec'?`Topic training · ${r.title}`:r.title;
  let h=`<span class="podium-lab">${esc(label)}</span>`;
  if(showMedal)h+=`<div class="medal ${m||'n'}">${res.c}/${res.n}</div><h1>${m?MEDAL_NAME[m]+' medal':'Keep training'}</h1>`;
  else h+=`<div class="medal n">${r.correct}/${r.asked}</div><h1>${r.mode==='notebook'?'Notebook practice done':'Training done'}</h1>`;
  if(pb)h+=`<span class="pb">NEW PERSONAL BEST</span>`;
  const perf=r.kind==='track'?fmtTime(res.v):res.v?metres(res.v).replace(' m','<small> m</small>'):'—';
  h+=`<div class="res-stats"><div class="card"><span class="lab">${r.kind==='track'?'Time':r.kind==='height'?'Height':'Best'}</span><b>${perf}</b></div><div class="card"><span class="lab">XP</span><b>+${r.xp+bonus}</b></div><div class="card"><span class="lab">Best run</span><b>${r.best}</b></div></div>`;
  const notes=[];
  if(r.kind==='height')notes.push(res.v?`You cleared ${res.c} height${res.c>1?'s':''}, up to ${metres(res.v)}.`:'No height cleared this time.');
  else if(r.kind!=='track')notes.push(`Your ${r.kind==='throw'?'throws':'jumps'}: ${res.series.map(d=>d?metres(d):'no mark').join(', ')}.`);
  else if(r.penalty)notes.push(`Your time includes ${r.penalty/1000} s of penalties.`);
  if(after>before)notes.push(`Level up! You are now level ${after}: ${rankOf(after)}.${KITS.some(k=>k.lv>before&&k.lv<=after)?' A new kit colour is unlocked in the Me tab.':''}`);
  if(unlockedNext)notes.push(`The ${ROUNDS[r.round+1]} is now unlocked.`);
  if(r.missedNew)notes.push(`${r.missedNew} question type${r.missedNew>1?'s':''} went into your notebook. ${r.missedNew>1?'They come':'It comes'} back with new numbers.`);
  if(r.cleared)notes.push(`${r.cleared} question type${r.cleared>1?'s':''} cleared from your notebook.`);
  if(restNote)notes.push(restNote);
  if(r.mode==='champ'){const w=Object.entries(r.wrongBy).sort((a,b)=>b[1]-a[1]).slice(0,3);if(w.length)notes.push('Units to revise: '+w.map(([u,c])=>`${u} (${c} wrong)`).join('; ')+'.')}
  if(showMedal&&!m)notes.push(r.kind==='height'?'Clear 5 heights or more to win a medal.':'Get half or more right to win a medal. Read the tips, then try again.');
  if(notes.length)h+=`<div class="card notes">${notes.map(x=>`<p>${esc(x)}</p>`).join('')}</div>`;
  if(newBadges.length)h+=`<div class="card notes newb"><span class="lab">New badge${newBadges.length>1?'s':''}</span>${newBadges.map(id=>{const b=BADGES.find(x=>x[0]===id);return `<p><b>${esc(b[1])}</b> · ${esc(b[2])}</p>`}).join('')}</div>`;
  const canNext=r.mode==='event'&&r.round<2&&unlocked(p,r.unit,r.round+1);
  h+=`<div class="btns">${canNext?`<button class="btn primary" type="button" id="b-nextround">Go to the ${ROUNDS[r.round+1]}</button>`:''}${r.mode!=='daily'&&r.mode!=='notebook'?`<button class="btn${canNext?'':' primary'}" type="button" id="b-again">${r.mode==='sec'?'Train again':'Race again'}</button>`:''}<button class="btn${r.mode==='daily'||r.mode==='notebook'?' primary':''}" type="button" id="b-home">Back to the stadium</button></div>`;
  $('#res').innerHTML=h;show('s-result');Sound.music(null);
  if(showMedal&&m==='g'){Sound.play('fanfare');Sound.play('cheer',true);Sound.buzz([60,40,60,40,120])}else if(showMedal&&m){Sound.play('medal');Sound.play('cheer',false)}else Sound.play('soft');
  if(after>before)setTimeout(()=>{Sound.play('level');toast('Level up! '+rankOf(after),3000)},900);
  const nr=$('#b-nextround');if(nr)nr.onclick=()=>startRace({mode:'event',unit:r.unit,round:r.round+1});

}
function badgeTest(id,p,r){
  const t=tally(p),w=weekOf(dayNum());
  switch(id){case 'marks':return p.races>=1;case 'gold1':return t.g>=1;case 'comeback':return !!r.flags.comeback;case 'hot10':return r.best>=10;
    case 'nb20':return p.nbCleared>=20;case 'nb50':return p.nbCleared>=50;case 'week3':return (p.days||[]).filter(d=>weekOf(d)===w).length>=3;
    case 'relay5':return p.relays>=5;case 'pb5':return p.pbs>=5;case 'sweep':return Object.values(p.best).some(a=>a&&a.length===3&&a.every(x=>medalOf(x)==='g'));
    case 'typed10':return p.typedRight>=10;case 'power':return p.pwUsed>=1;case 'flyer':return !!r.flags.allHeights;case 'distance':return !!r.flags.distance;
    case 'champ':return !!r.flags.champGold;case 'explorer':return Object.keys(p.events).length>=10}
  return false;
}
